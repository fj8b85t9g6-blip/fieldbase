<!-- ── Sync FAB (floating "sync platforms" button + toast) — included on owner pages ── -->
<style>
.fbsync-btn {
    position: fixed; bottom: 96px; right: 28px; z-index: 200;
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff; border: 1.5px solid #1e3a5f; color: #1e3a5f; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    transition: background 0.2s, transform 0.15s;
}
.fbsync-btn:hover { background: #f0f4f9; transform: scale(1.06); }
.fbsync-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.fbsync-btn.spinning svg { animation: fbsync-spin 0.8s linear infinite; transform-origin: 50% 50%; }
@keyframes fbsync-spin { to { transform: rotate(360deg); } }
.fbsync-toast {
    position: fixed; bottom: 160px; right: 28px; z-index: 400;
    background: #166534; color: #fff; padding: 12px 20px;
    border-radius: 8px; font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    font-family: 'Segoe UI', sans-serif; max-width: 300px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.fbsync-toast.show { opacity: 1; }
.fbsync-toast.err  { background: #dc2626; }
@media (max-width: 480px) {
    .fbsync-btn   { bottom: 80px; right: 16px; width: 46px; height: 46px; }
    .fbsync-toast { bottom: 134px; right: 16px; }
}
</style>

<button class="fbsync-btn" id="fbsync-btn" onclick="fbSync()" title="Sync jobs from WorkMarket &amp; Field Nation">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
</button>
<div id="fbsync-toast" class="fbsync-toast"></div>

<script>
(function() {
    window.fbSync = async function() {
        const btn = document.getElementById('fbsync-btn');
        if (btn.disabled) return;
        btn.disabled = true; btn.classList.add('spinning');
        try {
            const res  = await fetch('/api/sync-platform', { method: 'POST' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) { _t(data.error || 'Sync failed. Check your API keys in Settings.', true); return; }
            const errs = (data.synced && data.synced.errors) || [];
            if (errs.length) _t((data.message || 'Sync complete') + ' — ' + errs[0], true);
            else             _t(data.message || 'Sync complete', false);
            // Refresh live calendar view if this page has one
            if (window.calendar && typeof window.calendar.refetchEvents === 'function') window.calendar.refetchEvents();
        } catch(err) {
            _t('Connection error: ' + err.message, true);
        } finally {
            btn.disabled = false; btn.classList.remove('spinning');
        }
    };
    function _t(msg, err) {
        const el = document.getElementById('fbsync-toast');
        el.textContent = msg;
        el.className = 'fbsync-toast show' + (err ? ' err' : '');
        setTimeout(() => { el.className = 'fbsync-toast'; }, 4500);
    }
})();
</script>
