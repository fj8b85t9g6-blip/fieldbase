<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FieldBase — Payment</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172033}.card{max-width:520px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:38px;text-align:center;box-shadow:0 12px 35px rgba(15,23,42,.08)}.icon{font-size:44px}.card h1{color:#17324f}.card p{color:#64748b;line-height:1.6}.brand{font-weight:800;color:#17324f;margin-top:25px}</style>
</head><body><main class="card"><div class="icon">{{ '✓' if paid else '↩' }}</div><h1>{{ 'Payment Received' if paid else 'Payment Not Completed' }}</h1><p>{{ 'Thank you. The service provider will receive confirmation from Stripe.' if paid else 'No charge was completed. You can return to the invoice email whenever you are ready.' }}</p><div class="brand">FieldBase Secure Payments</div></main></body></html>
