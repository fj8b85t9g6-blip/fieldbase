<style>
  :root {
    --fb-navy: #17324f;
    --fb-navy-strong: #10263c;
    --fb-blue: #2563eb;
    --fb-canvas: #f4f6f9;
    --fb-border: #dce3ec;
    --fb-muted: #64748b;
    --fb-focus: #60a5fa;
  }

  html { scroll-behavior: smooth; }
  body { overflow-x: hidden; }
  button, a, input, select, textarea { touch-action: manipulation; }
  button, a { -webkit-tap-highlight-color: rgba(37, 99, 235, 0.15); }
  h1, h2, h3 { text-wrap: balance; }
  p { text-wrap: pretty; }
  input, select, textarea { max-width: 100%; }
  input:focus-visible, select:focus-visible, textarea:focus-visible,
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--fb-focus) !important;
    outline-offset: 2px;
  }

  .fb-skip-link {
    position: fixed;
    z-index: 10000;
    top: 8px;
    left: 8px;
    transform: translateY(-140%);
    padding: 9px 14px;
    border-radius: 7px;
    background: #fff;
    color: var(--fb-navy);
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 4px 18px rgba(15, 23, 42, 0.22);
  }
  .fb-skip-link:focus { transform: translateY(0); }

  .fb-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: stretch;
    gap: 2px;
    padding: 0 max(16px, env(safe-area-inset-left));
    overflow-x: auto;
    overscroll-behavior-inline: contain;
    border-bottom: 1px solid var(--fb-border);
    background: rgba(255, 255, 255, 0.97);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    scrollbar-width: thin;
  }
  .fb-nav-group {
    display: flex;
    align-items: stretch;
    flex: 0 0 auto;
  }
  .fb-nav-group + .fb-nav-group {
    margin-left: 7px;
    padding-left: 8px;
    border-left: 1px solid #e5e7eb;
  }
  .fb-nav a {
    display: inline-flex;
    align-items: center;
    min-height: 48px;
    padding: 0 12px;
    border-bottom: 3px solid transparent;
    color: #59677a;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: color 150ms ease, background-color 150ms ease, border-color 150ms ease;
  }
  .fb-nav a:hover { background: #f7f9fc; color: var(--fb-navy); }
  .fb-nav a.active {
    border-bottom-color: var(--fb-blue);
    color: var(--fb-navy);
    background: #f8fbff;
  }
  .fb-trial-banner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 10px 20px;
    border-bottom: 1px solid #fbbf24;
    background: #fffbeb;
    color: #854d0e;
    font-size: 13px;
  }
  .fb-trial-banner a { color: #854d0e; font-weight: 800; }
  #main-content { scroll-margin-top: 68px; }
  [aria-live] { min-height: 1em; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  @media (max-width: 720px) {
    .fb-nav { padding: 0 6px; }
    .fb-nav a { min-height: 46px; padding: 0 10px; font-size: 12px; }
    .fb-nav-group + .fb-nav-group { margin-left: 3px; padding-left: 4px; }
    .fb-trial-banner { align-items: flex-start; justify-content: space-between; padding: 10px 14px; }
  }
</style>
